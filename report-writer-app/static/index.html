<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pastoral Report Writing Companion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Pastoral Report Writing Companion</h1>
    <p class="tagline">Answer a few quick questions, get a Wesley-style draft.</p>
  </header>

  <div class="progress-track" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <main class="app">
   <div class="card">
    <section id="screen-select" class="screen">
      <h2>Which report are you writing?</h2>
      <div class="type-choices">
        <button class="type-btn" data-type="tutor">
          <span class="type-title">Tutor Report</span>
          <span class="type-sub">Years 7&ndash;12 &middot; 100&ndash;150 words</span>
        </button>
        <button class="type-btn" data-type="pyp">
          <span class="type-title">PYP Semester Report</span>
          <span class="type-sub">Prep&ndash;6 &middot; 180&ndash;300 words</span>
        </button>
      </div>
    </section>

    <section id="screen-pronouns" class="screen hidden">
      <h2>Student's pronouns</h2>
      <div class="pronouns-options">
        <button class="pronoun-btn" data-pronoun="they/them">They/Them (gender-neutral)</button>
        <button class="pronoun-btn" data-pronoun="he/him">He/Him</button>
        <button class="pronoun-btn" data-pronoun="she/her">She/Her</button>
        <button class="pronoun-btn" data-pronoun="other">Other (I'll type it)</button>
        <button class="pronoun-btn" data-pronoun="none">No pronouns (avoid pronouns)</button>
      </div>
      <div id="other-pronoun" class="hidden">
        <label class="freetext-label" for="custom-pronoun">Enter pronouns:</label>
        <input type="text" id="custom-pronoun" placeholder="e.g., ze/zir">
      </div>
      <div class="nav-buttons">
        <button id="pronoun-next-btn" class="btn btn-primary" disabled>Next</button>
      </div>
    </section>

    <section id="screen-context" class="screen hidden">
      <h2>Student's Tutor Group and House</h2>
      <div style="margin-top: 1.5rem;">
        <label class="freetext-label" for="tutor-group-input">Tutor Group (e.g., 7A, 11D):</label>
        <input type="text" id="tutor-group-input" placeholder="e.g., 7A" style="margin-top: 0.5rem;">

        <label class="freetext-label" for="house-input" style="margin-top: 1rem;">House (e.g., Adamson, Corrigan, Irving, Way):</label>
        <input type="text" id="house-input" placeholder="e.g., Adamson" style="margin-top: 0.5rem;">
      </div>
      <div class="nav-buttons">
        <button id="context-next-btn" class="btn btn-primary" style="margin-top: 1.5rem;">Next</button>
      </div>
    </section>

    <section id="screen-question" class="screen hidden">
      <p class="progress" id="progress-text"></p>
      <h2 id="question-text"></h2>
      <label class="freetext-label" for="answer-input">Your answer:</label>
      <textarea id="answer-input" rows="4" placeholder="Type what you know about this student..."></textarea>
      <div class="nav-buttons">
        <button id="back-btn" class="btn btn-secondary">Back</button>
        <button id="another-btn" class="btn btn-secondary">Another question</button>
        <button id="skip-btn" class="btn btn-secondary">Skip this</button>
        <button id="next-btn" class="btn btn-primary">Next</button>
        <button id="generate-btn" class="btn btn-primary hidden">Generate draft</button>
      </div>
    </section>

    <section id="screen-result" class="screen hidden">
      <h2>Your draft report</h2>
      <p class="sample-note">Edit as needed. Copy and paste into Word, then add student name.</p>
      <p id="error-banner" class="error-banner hidden"></p>
      <p id="loading-text" class="loading-text hidden">Writing your draft...</p>
      <textarea id="draft-text" rows="10" class="hidden"></textarea>
      <p class="word-count hidden" id="word-count-text"></p>
      <div class="result-buttons">
        <button id="copy-btn" class="btn btn-primary hidden">Copy to clipboard</button>
        <button id="start-over-btn" class="btn btn-secondary">Start a new student</button>
      </div>
    </section>
   </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
